<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: Deep Space Obsidian -->
    <radialGradient id="bgObsidian" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#111317" />
      <stop offset="60%" stop-color="#08090C" />
      <stop offset="100%" stop-color="#020304" />
    </radialGradient>

    <!-- Warm Glowing Ring Light -->
    <linearGradient id="warmRingLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FFFBEB" />
      <stop offset="85%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- Ring Bloom Filter -->
    <filter id="haloBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#FEF3C7" flood-opacity="0.85" />
    </filter>

    <!-- Amber Neck Collar Illumination (Exact from photo) -->
    <radialGradient id="amberNeckLight" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#FFAE19" stop-opacity="1" />
      <stop offset="30%" stop-color="#E58E00" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#B25E00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Inner Faceplate Shading -->
    <radialGradient id="faceplateShading" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2D323B" />
      <stop offset="50%" stop-color="#1B1E24" />
      <stop offset="100%" stop-color="#0F1116" />
    </radialGradient>

    <!-- Horizontal Camera Bar Inset Bezel -->
    <linearGradient id="cameraBarBezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060709" />
      <stop offset="100%" stop-color="#1F232B" />
    </linearGradient>

    <!-- Camera Window Cavity -->
    <linearGradient id="lensCavity" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Speaker / Ventilation Grille Texture Pattern -->
    <pattern id="horizontalGrille" width="8" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="2" x2="8" y2="2" stroke="rgba(0,0,0,0.5)" stroke-width="1.2" />
      <line x1="0" y1="3" x2="8" y2="3" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" />
    </pattern>

    <!-- Torso Blue Material (Exact Boston Dynamics Blue) -->
    <linearGradient id="atlasBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B96C3" />
      <stop offset="35%" stop-color="#4B7BAA" />
      <stop offset="70%" stop-color="#366594" />
      <stop offset="100%" stop-color="#254B73" />
    </linearGradient>

    <!-- Black Upper Chest Material -->
    <linearGradient id="chestBlack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D323B" />
      <stop offset="40%" stop-color="#1C2026" />
      <stop offset="100%" stop-color="#0F1115" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="headShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="lensGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Apple Squircle Canvas (512x512) -->
  <rect width="512" height="512" rx="115" fill="url(#bgObsidian)" />
  <rect x="3" y="3" width="506" height="506" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6" />

  <!-- ==================== BODY & SHOULDERS ==================== -->
  <!-- Blue Lower Torso Chassis -->
  <path d="M 100 460 C 110 415, 145 400, 190 395 L 322 395 C 367 400, 402 415, 412 460 L 424 512 L 88 512 Z" fill="url(#atlasBlue)" />

  <!-- Left & Right Shoulder Actuator Pods (Rotary Discs) -->
  <!-- Left Shoulder -->
  <g id="left-shoulder">
    <rect x="84" y="360" width="70" height="105" rx="32" fill="#1A1D24" stroke="#0A0B0E" stroke-width="4" />
    <circle cx="119" cy="412" r="26" fill="#252A34" stroke="#12141A" stroke-width="3" />
    <circle cx="119" cy="412" r="14" fill="#161820" />
  </g>
  <!-- Right Shoulder -->
  <g id="right-shoulder">
    <rect x="358" y="360" width="70" height="105" rx="32" fill="#1A1D24" stroke="#0A0B0E" stroke-width="4" />
    <circle cx="393" cy="412" r="26" fill="#252A34" stroke="#12141A" stroke-width="3" />
    <circle cx="393" cy="412" r="14" fill="#161820" />
  </g>

  <!-- Black Upper Chest Collar Plate -->
  <path d="M 174 380 C 174 355, 205 346, 256 346 C 307 346, 338 355, 338 380 L 344 445 L 168 445 Z" fill="url(#chestBlack)" stroke="#0C0D11" stroke-width="4" />

  <!-- Boston Dynamics Embossed Wordmark on Chest -->
  <text x="256" y="405" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="13" font-weight="700" fill="#0A0C10" text-anchor="middle" letter-spacing="0.5" opacity="0.9">Boston Dynamics</text>

  <!-- Amber Underglow Reflection from Neck LED -->
  <ellipse cx="256" cy="358" rx="64" ry="34" fill="url(#amberNeckLight)" />

  <!-- Neck Stalk -->
  <rect x="234" y="270" width="44" height="88" rx="6" fill="#12151B" stroke="#090B0E" stroke-width="3" />
  <!-- Golden Neck Emitter Ring (Source of amber underglow) -->
  <rect x="232" y="334" width="48" height="12" rx="4" fill="#FFAE19" />

  <!-- ==================== SIGNATURE TOP-RIGHT ANTENNA STALK ==================== -->
  <g id="antenna-peg">
    <rect x="338" y="34" width="16" height="72" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
    <circle cx="346" cy="42" r="6" fill="#FFFFFF" />
  </g>

  <!-- ==================== THE CIRCULAR ATLAS HEAD ==================== -->
  <g filter="url(#headShadow)">
    <!-- Outer Dark Bezel Frame -->
    <circle cx="256" cy="172" r="148" fill="#0E1015" stroke="#060709" stroke-width="6" />

    <!-- THE GLOWING CIRCULAR RING LIGHT (The defining Atlas Feature) -->
    <circle cx="256" cy="172" r="132" fill="none" stroke="url(#warmRingLight)" stroke-width="28" filter="url(#haloBloom)" />

    <!-- Inner Dark Faceplate Dish -->
    <circle cx="256" cy="172" r="118" fill="url(#faceplateShading)" stroke="#090B0E" stroke-width="3" />

    <!-- Upper Half: Fine Horizontal Speaker/Sensor Grille Lines -->
    <path d="M 148 162 C 154 94, 358 94, 364 162 Z" fill="url(#horizontalGrille)" opacity="0.9" />
    <!-- Fine Horizontal Grille Edge Seam -->
    <line x1="148" y1="164" x2="364" y2="164" stroke="rgba(0,0,0,0.6)" stroke-width="2" />
    <line x1="150" y1="165" x2="362" y2="165" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <!-- ==================== THE HORIZONTAL CAMERA BAR ==================== -->
    <!-- Recessed Outer Bezel (Rounded Rectangle Bar) -->
    <rect x="168" y="176" width="176" height="74" rx="20" fill="url(#cameraBarBezel)" stroke="#323846" stroke-width="3.5" />
    <!-- Inner Dark Cavity -->
    <rect x="174" y="182" width="164" height="62" rx="15" fill="#060709" />

    <!-- Left Camera Window (Square with Rounded Corners) -->
    <rect x="188" y="193" width="40" height="40" rx="9" fill="url(#lensCavity)" stroke="#263144" stroke-width="2" />
    <!-- Left Camera Lens & Aperture -->
    <circle cx="208" cy="213" r="13" fill="#020617" />
    <circle cx="208" cy="213" r="7" fill="#03203E" />
    <!-- Blue Optical Iris & White Specular Highlight Glint -->
    <circle cx="208" cy="213" r="4.5" fill="#0284C7" />
    <circle cx="204" cy="209" r="4" fill="#38BDF8" filter="url(#lensGlow)" />
    <circle cx="203" cy="208" r="2" fill="#FFFFFF" />

    <!-- Center Sensor Aperture Dot -->
    <circle cx="256" cy="213" r="4.5" fill="#1A202A" stroke="#08090C" stroke-width="1.5" />

    <!-- Right Camera Window (Square with Rounded Corners) -->
    <rect x="284" y="193" width="40" height="40" rx="9" fill="url(#lensCavity)" stroke="#263144" stroke-width="2" />
    <!-- Right Camera Lens & Aperture -->
    <circle cx="304" cy="213" r="13" fill="#020617" />
    <circle cx="304" cy="213" r="7" fill="#03203E" />
    <!-- Blue Optical Iris & White Specular Highlight Glint -->
    <circle cx="304" cy="213" r="4.5" fill="#0284C7" />
    <circle cx="300" cy="209" r="4" fill="#38BDF8" filter="url(#lensGlow)" />
    <circle cx="299" cy="208" r="2" fill="#FFFFFF" />
  </g>
</svg>